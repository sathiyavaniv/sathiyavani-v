<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2E205"/>
      <stop offset="100%" stop-color="#5CE65C"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- shopping cart icon -->
  <g transform="translate(70,80)" stroke="#F2E205" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 0 H18 L34 70 H100 L112 25 H28"/>
    <circle cx="42" cy="90" r="9" fill="#F2E205" stroke="none"/>
    <circle cx="92" cy="90" r="9" fill="#5CE65C" stroke="none"/>
  </g>

  <!-- donut chart accent -->
  <g transform="translate(1010,95)">
    <circle cx="45" cy="45" r="40" fill="none" stroke="#2A2A2A" stroke-width="18"/>
    <circle cx="45" cy="45" r="40" fill="none" stroke="#F2E205" stroke-width="18"
            stroke-dasharray="150 251" transform="rotate(-90 45 45)"/>
    <circle cx="45" cy="45" r="40" fill="none" stroke="#5CE65C" stroke-width="18"
            stroke-dasharray="70 251" stroke-dashoffset="-150" transform="rotate(-90 45 45)"/>
  </g>

  <!-- small funnel bars -->
  <g transform="translate(890,150)" fill="#F2843C" opacity="0.85">
    <rect x="0" y="0" width="70" height="12" rx="4"/>
    <rect x="10" y="16" width="50" height="12" rx="4"/>
    <rect x="20" y="32" width="30" height="12" rx="4"/>
  </g>

  <text x="220" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF">
    Superstore Sales
  </text>
  <text x="220" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#F2E205">
    Performance Dashboard
  </text>
  <text x="220" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#B8B8B8">
    Power BI · Excel · Sales, Profit &amp; Regional Analysis
  </text>

  <rect x="0" y="252" width="1200" height="8" fill="url(#accent)"/>
</svg>
